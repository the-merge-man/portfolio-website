<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jack Simon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="gate">
    <div class="timer-line">
      <div class="timer-fill" id="timer-fill"></div>
    </div>

    <p class="gate-problem" id="gate-problem">&nbsp;</p>

    <form id="gate-form" class="gate-form" autocomplete="off">
      <input type="text" id="gate-answer" class="gate-input" inputmode="numeric" autofocus>
    </form>

    <p class="gate-feedback" id="gate-feedback">&nbsp;</p>
  </main>

  <script src="js/gate.js"></script>
</body>
</html>
